name: Tests and reproducible candidate packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Go tests with race detector
        working-directory: listener
        run: go test -race ./...
      - name: Go vet
        working-directory: listener
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Build twice from committed source and compare
        run: |
          python tools/package_release.py --output dist/first
          python tools/package_release.py --output dist/second
          diff dist/first/SHA256SUMS.txt dist/second/SHA256SUMS.txt
          cd dist/first
          sha256sum --check SHA256SUMS.txt
      # This builds local candidates only; no release upload or publication.
      # Compilation cannot verify GUI, tray, SendInput, firewall or Windows autostart.
  companion-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-dev-modules/companion-module-community-openlistener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: companion-dev-modules/companion-module-community-openlistener/package-lock.json
      - name: Install the locked production dependency tree
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate against installed Companion base
        run: npm run validate
      - name: Module tests
        run: node --test src/*.test.cjs
