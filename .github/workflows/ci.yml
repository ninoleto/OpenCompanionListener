name: Tests and Windows build

on:
  push:
  pull_request:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: listener/go.mod
      - name: Go tests with race detector
        working-directory: listener
        run: go test -race ./...
      - name: Go vet
        working-directory: listener
        run: go vet ./...
      - name: Vet Windows target
        working-directory: listener
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Build Windows executable
        working-directory: listener
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w -H windowsgui' -o ../OpenCompanionListener.exe .
      # Compilation cannot verify GUI, tray, SendInput, firewall or Windows autostart.
  companion-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-dev-modules/companion-module-community-openlistener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Module tests
        run: node --test src/*.test.cjs
